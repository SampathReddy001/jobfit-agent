[project]
name = "jobfit-agent"
version = "1.0.0"
description = "An AI job-hunt agent built on Gemini function calling"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File(...) defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
